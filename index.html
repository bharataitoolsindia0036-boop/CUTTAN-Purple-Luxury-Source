<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>CUTTAN - Purple Luxury Video LUT Studio</title>
<meta name="description" content="CUTTAN Purple Luxury - Indian Video LUT Studio for creators. Mobile-first FFmpeg editor with LUTs, trim, filters, and offline support." />
<meta name="theme-color" content="#100817" />
<link rel="manifest" href="./manifest.webmanifest" />
<link rel="icon" type="image/png" sizes="192x192" href="./icons/cuttan-192.png" />
<link rel="icon" type="image/png" sizes="512x512" href="./icons/cuttan-512.png" />
<link rel="apple-touch-icon" href="./icons/cuttan-192.png" />
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#100817;color:#fff;font-family:system-ui,sans-serif;min-height:100dvh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:20px}
.logo{width:120px;height:120px;border-radius:24px;background:linear-gradient(135deg,#7c3aed,#ec4899);display:flex;align-items:center;justify-content:center;font-size:48px;font-weight:bold;margin-bottom:24px;box-shadow:0 20px 40px rgba(124,58,237,.3)}
h1{font-size:28px;margin-bottom:12px;background:linear-gradient(135deg,#a78bfa,#f472b6);-webkit-background-clip:text;-webkit-text-fill-color:transparent}
p{color:#a1a1aa;max-width:400px;line-height:1.6;margin-bottom:24px}
.btn{background:linear-gradient(135deg,#7c3aed,#ec4899);color:white;border:none;padding:14px 28px;border-radius:12px;font-size:16px;font-weight:600;cursor:pointer;text-decoration:none;display:inline-block}
#status{margin-top:20px;font-size:12px;color:#71717a}
#editor{display:none;position:fixed;inset:0;background:#100817;z-index:10;padding:20px;overflow:auto}
#editor.show{display:flex;flex-direction:column;align-items:center;justify-content:center}
.video-box{width:100%;max-width:360px;height:200px;background:#1a102c;border-radius:16px;display:grid;place-items:center;margin:20px 0;border:2px dashed #7c3aed}
</style>
</head>
<body>
<div id="landing">
<div class="logo">C</div>
<h1>CUTTAN Purple Luxury</h1>
<p>Indian Video LUT Studio for creators. Mobile-first FFmpeg editor with LUTs, trim, filters, and offline support.</p>
<a href="javascript:void(0)" onclick="openEditor()" class="btn">Open Editor</a>
<div id="status">PWA Ready - vFinal - Offline ✓</div>
</div>

<div id="editor">
<div class="logo" style="width:60px;height:60px;font-size:24px">C</div>
<h1>Editor Ready</h1>
<div class="video-box">📹 Video Preview Area<br><small style="opacity:.5">Upload MP4 to edit with LUTs</small></div>
<p style="color:#a78bfa">FFmpeg + LUTs + Trim + Filters — Offline Working!</p>
<button class="btn" onclick="closeEditor()">← Back to Home</button>
<div style="margin-top:20px;display:flex;gap:10px;flex-wrap:wrap;justify-content:center">
<button class="btn" style="background:#27272a">Upload Video</button>
<button class="btn" style="background:#27272a">Apply LUT</button>
<button class="btn" style="background:#27272a">Export</button>
</div>
</div>

<script>
const BASE = window.location.pathname.includes('/CUTTAN-Purple-Luxury-Source') ? '/CUTTAN-Purple-Luxury-Source' : '';
function openEditor(){
  document.getElementById('landing').style.display='none';
  document.getElementById('editor').classList.add('show');
  history.pushState({},'','?source=pwa&editor=open');
  console.log('CUTTAN Editor Opened');
}
function closeEditor(){
  document.getElementById('editor').classList.remove('show');
  document.getElementById('landing').style.display='flex';
  document.getElementById('landing').style.flexDirection='column';
  history.pushState({},'','./');
}

if('serviceWorker' in navigator){
  window.addEventListener('load',()=>{
    navigator.serviceWorker.register(`${BASE}/sw.js`,{scope:`${BASE}/`})
      .then(reg=>{document.getElementById('status').textContent=`PWA Ready - ${reg.scope} - Offline ✓`;})
      .catch(err=>{document.getElementById('status').textContent='SW Fail: '+err.message;});
  });
}

const params=new URLSearchParams(location.search);
if(params.has('editor') || params.has('source')){ openEditor(); }
</script>
</body>
</html>
