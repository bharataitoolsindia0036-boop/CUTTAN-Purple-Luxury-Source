<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>CUTTAN - Purple Luxury Video LUT Studio</title>
    <meta name="description" content="Local-first video colour and trim studio - CUTTAN" />
    
    <!-- PWA - CORRECT -->
    <link rel="manifest" href="./manifest.json" />
    <meta name="theme-color" content="#100817" />
    <meta name="background-color" content="#100817" />
    
    <!-- Icons - CORRECT -->
    <link rel="icon" type="image/png" sizes="192x192" href="./icons/cuttan-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="./icons/cuttan-512.png" />
    <link rel="apple-touch-icon" href="./icons/cuttan-192.png" />
    
    <!-- Apple PWA -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CUTTAN" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
    
    <script>
      if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
          navigator.serviceWorker.register('./sw.js')
            .then(reg => console.log('SW registered', reg.scope))
            .catch(err => console.log('SW failed', err));
        });
      }
    </script>
  </body>
</html>
